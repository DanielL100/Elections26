name: Run Election Data Scraper

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger via GitHub UI

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permissions to commit back to repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 playwright-stealth

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Execute Scraper
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update election data [skip ci]" && git push)
