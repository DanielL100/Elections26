# Save as: .github/workflows/scrape.yml  (replaces the Node version)
name: Scrape election results

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (GitHub's minimum is 5; runs can lag)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-election
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip            # uses requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Scrape election data
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/data.json; then
            echo "No changes to data/data.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "Update election data"
          git pull --rebase
          git push

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-debug
          path: |
            data/debug.html
            data/debug-meta.json
          if-no-files-found: ignore
          retention-days: 3
