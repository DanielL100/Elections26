name: Election Results Scraper

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes back to the repo

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright beautifulsoup4 playwright-stealth

    - name: Install Playwright Browsers
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Run Scraper Script
      run: |
        python scraper.py

    - name: Commit and push scraped CSV
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add elections_results.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update election data [skip ci]" && git push)
