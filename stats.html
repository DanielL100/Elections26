<!doctype html>
<html lang="he">
  	<head>
		<!-- Required meta tags -->
		<meta charset="utf-8">
		<title>Charts</title>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Alef&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/infoStyle.css">
		<link rel="icon" href="logo_elections.png">
	</head>
	
	<body dir="rtl" class="d-flex flex-column min-vh-100">
		<div id="navbar-container"></div>

		<div class="container">
			<h2>מצב הגושים</h2>
			<div class="row">
				<div id="pie_legend"></div>
			</div>
			<div class="row">
				<div class="canv col-md-7">
					<canvas id="blocks" dir="rtl"></canvas>
				</div>
				<div class="canv col-md-5">
					<canvas id="myChart2"></canvas>
				</div>
			</div>
			<h2>מנדטים</h2>
			<div class="canv" style="height: 300px">
				<canvas id="parties"></canvas>
			</div>
			<h2>מצב פנים-גושי</h2>
			<div class="row">
				<div class="canv col-md-6">
					<canvas id="netanyahu-block"></canvas>
				</div>
				<div class="canv col-md-6">
					<canvas id="eizenkot-block"></canvas>
				</div>
			</div>
			<h2>קולות אבודים</h2>
			<div class="row">
				<div class="canv col-md-6 mx-auto">
					<canvas id="wasted-votes"></canvas>
				</div>
				<div class="canv col-md-6 mx-auto">
					<canvas id="wasted-parties"></canvas>
				</div>
			</div>
			<h2>המפלגות שקרובות לעבור</h2>
			<div class="canv" style="height: 300px">
				<canvas id="almost-enter"></canvas>
			</div>
        </div>

        <div id="footer-container"></div>
		
		<!-- Optional JavaScript -->
    	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
		<script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
		<script src="https://code.jquery.com/ui/1.13.1/jquery-ui.js" integrity="sha256-6XMVI0zB8cRzfZjqKcD01PBsAy3FlDASrlC8SxCpInY=" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" integrity="sha512-ElRFoEQdI5Ht6kZvyzXhYG9NqjtkmlkfYk0wr6wHxU9JEHakS7UJZNeml5ALk+8IKlU6jDgMabC3vkumRokgJA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
		<script src="js/layout.js"></script>
		<script src="config.js"></script>
		<script src="js/core.js"></script>
		<script src="js/stats.js"></script>

		<script>
			MasterLayout.initPage({
				title: "גרפים",
				activePage: "stats",
				stickyFooter: true
			});
		</script>
	</body>
</html>
